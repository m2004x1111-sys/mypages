# benmingw 的个人博客配置。修改后重启开发服务器或重新构建。
site:
  title: ほんのいのちのページ
  alternate: 本命内
  subtitle: 百合に興味がなかったら、人生に何の意味があるの？
  name: benmingw
  author: benmingw
  description: 旅游，学习，翻译，百合！百合！还有百合！。
  avatar: /img/benmingw.webp
  showLogo: false
  url: https://benmingw-blog.dainty-hinny-5476.chatgpt.site
  defaultOgImage: /img/xingyuan.webp
  startYear: 2026
  timezone: Asia/Shanghai
  keywords:
    - benmingw
    - 个人博客
    - 旅行记录
    - 图片收藏
    - 喜欢的作品

i18n:
  defaultLocale: zh
  locales:
    - code: zh
      label: 中文

categoryMap:
  随笔: life
  旅行: travel
  收藏: collection
  周刊: weekly

featuredCategories:
  - link: travel
    label: 旅游日志
    image: /img/travel/微信图片_20261102182522_99_51.jpg
    description: 记录好看的东西
  - link: collection
    label: 插画集
    image: /img/cover/21.webp
    description: 图片
  - link: life
    label: 小窝随笔
    image: /img/cover/16.webp
    description: 关于这个小窝的点滴

featuredSeries:
  - slug: weekly
    categoryName: 周刊
    label: 每周手记
    fullName: benmingw 的每周手记
    description: |
      不急着把生活过成标准答案。
      在这里，留下一周的发现、思考和小小的进步。
    cover: /img/weekly_header.webp
    enabled: false
    icon: ri:newspaper-line
    links:
      rss: /rss.xml

# 首页个人资料卡片中的社交链接。
social:
  bilibili:
    url: https://space.bilibili.com/123344056
    icon: ri:bilibili-fill
    color: '#fb7299'
  rss:
    url: /rss.xml
    icon: ri:rss-line
    color: '#ed788b'

friends:
  groups:
    - id: following
      title: 灵感来源
      description: 喜欢的网站与博客。
  intro:
    title: 友情链接
    subtitle: 从一个小窝，遇见更大的世界。
    applyTitle: 留一个位置给未来的朋友
    applyDesc: 以后这里会放上朋友们的博客。
  data:
    - site: YukiBloom
      url: https://yuki-bloom.vercel.app/
      owner: smile丶snow
      desc: 这间小窝的设计参考。
      image: /img/cover/2.webp
      color: '#ed788b'
      group: following
    - site: Astro Koharu
      url: https://github.com/cosZone/astro-koharu
      owner: cosZone
      desc: 本站使用的开源博客主题。
      image: /img/cover/4.webp
      color: '#55acd5'
      group: following

content:
  addBlankTarget: true
  smoothScroll: true
  addHeadingLevel: true
  enhanceCodeBlock: true
  enableCodeCopy: true
  enableCodeFullscreen: true
  enableLinkEmbed: true
  enableOGPreview: false
  postCardImagePosition: alternating

motion:
  level: lively
  heroPetals: true
  clickBurst: true

editor:
  enabled: true

colophon:
  enabled: true
  defaults: []
  groups: {}
  marks: {}

postActions:
  copyMarkdown: true
  downloadMarkdown: true
  openInEditor: dev

navigation:
  - name: 首页
    nameKey: nav.home
    path: /
    icon: ri:home-heart-fill
  - name: 旅行日志
    path: /travel
    icon: ri:compass-3-line
  - name: 收藏
    icon: ri:image-line
    children:
      - name: 好看的插画
        path: /gallery
        icon: ri:image-line
      - name: 好看的卡面
        path: /cards
        icon: ri:sparkling-line
  - name: 喜欢的作品
    path: /favorites
    icon: ri:bookmark-3-line
  - name: 追番记录
    path: /anime
    icon: ri:tv-2-line
  - name: 文章
    nameKey: nav.posts
    icon: ri:quill-pen-ai-fill
    children:
      - name: 分类
        nameKey: nav.categories
        path: /categories
        icon: ri:grid-fill
      - name: 标签
        nameKey: nav.tags
        path: /tags
        icon: fa6-solid:tags
      - name: 归档
        nameKey: nav.archives
        path: /archives
        icon: ri:archive-2-fill
  - name: 关于
    nameKey: nav.about
    path: /about
    icon: fa6-regular:circle-user

comment:
  provider: none

analytics:
  umami:
    enabled: false

bgm:
  enabled: true # 歌单在 src/data/music.ts，音频放在 public/music/
  autoplay: true # 进入页面尝试播放第一首；浏览器拦截时，首次点击后播放

christmas:
  enabled: false
