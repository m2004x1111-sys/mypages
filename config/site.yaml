# benmingw 的个人博客配置。修改后重启开发服务器或重新构建。
site:
  title: benmingw の小窝
  alternate: benmingw
  subtitle: 把沿途的风景，和喜欢的故事收藏起来
  name: benmingw
  author: benmingw
  description: 记录旅行，收藏图片，留下喜欢的作品。这里是 benmingw 的个人小窝。
  avatar: /img/benmingw-avatar.svg
  showLogo: false
  url: https://benmingw-blog.dainty-hinny-5476.chatgpt.site
  defaultOgImage: /img/site_header_1200.webp
  startYear: 2026
  timezone: Asia/Shanghai
  keywords:
    - benmingw
    - 个人博客
    - 旅行记录
    - 图片收藏
    - 喜欢的作品

i18n:
  defaultLocale: zh
  locales:
    - code: zh
      label: 中文

categoryMap:
  随笔: life
  旅行: travel
  收藏: collection
  周刊: weekly

featuredCategories:
  - link: travel
    label: 旅行记录
    image: /img/travel/coast.webp
    description: 沿途的风景与旅行手记
  - link: collection
    label: 喜欢的收藏
    image: /img/cover/21.webp
    description: 图片、作品与想留下的心情
  - link: life
    label: 小窝随笔
    image: /img/cover/16.webp
    description: 关于这个小窝的点滴

featuredSeries:
  - slug: weekly
    categoryName: 周刊
    label: 每周手记
    fullName: benmingw 的每周手记
    description: |
      不急着把生活过成标准答案。
      在这里，留下一周的发现、思考和小小的进步。
    cover: /img/weekly_header.webp
    enabled: false
    icon: ri:newspaper-line
    links:
      rss: /rss.xml

# 有真实的社交账号后，可参照 GETTING-STARTED.md 添加。
social:
  rss:
    url: /rss.xml
    icon: ri:rss-line
    color: '#ed788b'

friends:
  groups:
    - id: following
      title: 灵感来源
      description: 喜欢的网站与博客。
  intro:
    title: 友情链接
    subtitle: 从一个小窝，遇见更大的世界。
    applyTitle: 留一个位置给未来的朋友
    applyDesc: 以后这里会放上朋友们的博客。
  data:
    - site: YukiBloom
      url: https://yuki-bloom.vercel.app/
      owner: smile丶snow
      desc: 这间小窝的设计参考。
      image: /img/cover/2.webp
      color: '#ed788b'
      group: following
    - site: Astro Koharu
      url: https://github.com/cosZone/astro-koharu
      owner: cosZone
      desc: 本站使用的开源博客主题。
      image: /img/cover/4.webp
      color: '#55acd5'
      group: following

content:
  addBlankTarget: true
  smoothScroll: true
  addHeadingLevel: true
  enhanceCodeBlock: true
  enableCodeCopy: true
  enableCodeFullscreen: true
  enableLinkEmbed: true
  enableOGPreview: false
  postCardImagePosition: alternating

motion:
  level: lively
  heroPetals: true
  clickBurst: true

editor:
  enabled: true

colophon:
  enabled: true
  defaults: []
  groups:
    notice:
      label: 阅读提示
      placement: [ meta, banner, card ]
  marks:
    example:
      group: notice
      icon: ri:seedling-line
      label: 示例文章
      description: 这是用于展示博客效果的示例内容，可以替换成你自己的文字。

postActions:
  copyMarkdown: true
  downloadMarkdown: true
  openInEditor: dev

navigation:
  - name: 首页
    nameKey: nav.home
    path: /
    icon: ri:home-heart-fill
  - name: 旅行记录
    path: /travel
    icon: ri:compass-3-line
  - name: 图片收藏
    path: /gallery
    icon: ri:image-line
  - name: 喜欢的作品
    path: /favorites
    icon: ri:bookmark-3-line
  - name: 文章
    nameKey: nav.posts
    icon: ri:quill-pen-ai-fill
    children:
      - name: 分类
        nameKey: nav.categories
        path: /categories
        icon: ri:grid-fill
      - name: 标签
        nameKey: nav.tags
        path: /tags
        icon: fa6-solid:tags
      - name: 归档
        nameKey: nav.archives
        path: /archives
        icon: ri:archive-2-fill
  - name: 关于
    nameKey: nav.about
    path: /about
    icon: fa6-regular:circle-user

comment:
  provider: none

analytics:
  umami:
    enabled: false

bgm:
  enabled: false

christmas:
  enabled: false
